# Serves the built app and forwards /api/* to the backend, like the Vite dev server does.
server {
    listen 80;
    root /usr/share/nginx/html;

    # CV upload (POST /api/profile/cv)
    client_max_body_size 20m;

    location /api/ {
        # The trailing slash strips /api: /api/matches -> http://backend:8000/matches
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI mode can take a while for the top N offers.
        proxy_read_timeout 300s;
    }

    # Hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/offers/:id, /profile, ...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

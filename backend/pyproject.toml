[project]
name = "job-seeker"
version = "0.1.0"
description = "Matches job offers from job boards (JustJoin.it, ...) to your CV"
readme = "README.md"
authors = [
    { name = "StaZarycki" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.12.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobseeker = "job_seeker.cli:app"

[project.optional-dependencies]
openai = [
    "openai>=3.26.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "openai>=3.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Polish text contains en dashes and similar characters

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
